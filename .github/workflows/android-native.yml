name: Build (Android Native)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android Native)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # The two 64-bit androidNative* targets cross-compile on any host.
      # Kotlin/Native test binaries are built by the full target gate; this
      # workflow provides explicit compile coverage for every Android Native
      # target. The 32-bit targets (androidNativeArm32, androidNativeX86)
      # were retired 2026-06-25 (AGENTS.md §5.5.3) because many upstream Rust
      # crates only provide 64-bit FFI and size_t width mismatch between
      # 32-bit UInt and 64-bit ULong breaks posixMain shared signatures.
      - name: Compile Android Native targets
        run: >
          ./gradlew
          compileKotlinAndroidNativeArm64
          compileKotlinAndroidNativeX64
          --no-configuration-cache
